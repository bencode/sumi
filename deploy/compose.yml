name: sumi

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${SUMI_BIND_IP:-172.17.0.1}:5810:8080"
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${SUMI_BIND_IP:-172.17.0.1}:5811:80"
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
